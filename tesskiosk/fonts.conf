<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Polices par défaut proches de celles de Windows / macOS (pages des extensions) -->
<fontconfig>
  <alias><family>system-ui</family><prefer><family>Roboto</family></prefer></alias>
  <alias><family>-apple-system</family><prefer><family>Roboto</family></prefer></alias>
  <alias><family>Segoe UI</family><prefer><family>Roboto</family></prefer></alias>
  <alias><family>Helvetica Neue</family><prefer><family>Roboto</family></prefer></alias>
  <alias><family>Bahnschrift</family><prefer><family>Roboto Condensed</family></prefer></alias>
  <alias><family>DIN Alternate</family><prefer><family>Roboto Condensed</family></prefer></alias>
  <alias><family>Arial Narrow</family><prefer><family>Roboto Condensed</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Roboto</family><family>Liberation Sans</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Liberation Serif</family><family>DejaVu Serif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Liberation Mono</family><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
